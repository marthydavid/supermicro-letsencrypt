name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: ShellCheck
        run: shellcheck le-supermicro-ipmi.sh

      - name: Python syntax
        run: python3 -m py_compile supermicro-ipmi-updater.py

      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Install updater dependencies
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install -r requirements.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      - name: Renewal logic
        run: bash tests/renewal-logic.sh

      - name: Updater unit tests
        run: python3 -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
